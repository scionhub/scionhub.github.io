title: OpenScion Docs
description: Documentation, research, specs, plans and ADRs for OpenScion
remote_theme: just-the-docs/just-the-docs@v0.10.0
plugins:
  - jekyll-remote-theme
  - jekyll-relative-links
  - jekyll-seo-tag
relative_links:
  enabled: true
  collections: false
include: [README.md]
search_enabled: true
aux_links:
  "OpenScion on GitHub": "https://github.com/scionhub/openscion"
defaults:
  - scope: {path: ""}
    values: {layout: default}
